name: CI

# Quality gates. Runs on every pull request of the gitflow branches and is reused by the
# deploy workflows, so nothing is applied unless the same checks pass on the pushed commit.
on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.16.2"
  TERRAGRUNT_VERSION: "1.1.5"

jobs:
  iac:
    name: IaC (format and team standards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup IaC Tooling
        uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive modules

      - name: Terragrunt HCL Format
        working-directory: environments
        run: terragrunt hcl fmt --check

      - name: Validate mandatory tags in root.hcl
        working-directory: environments
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          for key in team-owner project-name app-name repo-name env-type; do
            if ! grep -qE "^\s*\"$key\"\s*=" root.hcl; then
              echo "::error file=environments/root.hcl::Mandatory tag '$key' is missing from mandatory_tags"
              exit 1
            fi
          done
          if ! grep -qE "\"repo-name\"\s*=\s*\"$REPO_NAME\"" root.hcl; then
            echo "::error file=environments/root.hcl::Tag 'repo-name' does not match the repository name ($REPO_NAME)"
            exit 1
          fi
          echo "Mandatory tags present; repo-name = $REPO_NAME"

      - name: Validate S3 remote state
        working-directory: environments
        run: |
          if ! grep -qE '^\s*backend\s*=\s*"s3"' root.hcl; then
            echo "::error file=environments/root.hcl::The S3 remote_state backend is missing or commented out"
            exit 1
          fi
          echo "S3 remote state configured"

  terraform-validate:
    name: Terraform (validate, no credentials)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup IaC Tooling
        uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Validate Modules
        run: |
          set -euo pipefail
          for module in api-hostname; do
            echo "::group::terraform validate modules/$module"
            terraform -chdir="modules/$module" init -backend=false -input=false
            terraform -chdir="modules/$module" validate
            echo "::endgroup::"
          done
