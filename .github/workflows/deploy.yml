name: Deploy (reusable)

# Provisions the API edge of one environment with Terragrunt (regional ACM certificate, weighted
# Route 53 records, expiry alarms). Called by deploy-dev.yml and deploy-prod.yml; the GitHub
# environment of the same name provides the secrets and variables and, for prod, the manual approval.
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prod); also the GitHub environment name
        required: true
        type: string

permissions:
  id-token: write # Required for requesting the JWT for AWS OIDC
  contents: read # Required for actions/checkout

env:
  TERRAFORM_VERSION: "1.16.2"
  TERRAGRUNT_VERSION: "1.1.5"

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Never run two applies against the same state at once.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      # Read by env.hcl. Without SUPPORT_EMAIL the certificate alerts would go to a placeholder address.
      ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      # Routing weights (0-255) of the backends behind api.<web domain>. An unset variable counts as 0.
      API_WEIGHT_SLS: ${{ vars.API_WEIGHT_SLS }}
      API_WEIGHT_ECS: ${{ vars.API_WEIGHT_ECS }}
      API_WEIGHT_EKS: ${{ vars.API_WEIGHT_EKS }}
      API_WEIGHT_EC2: ${{ vars.API_WEIGHT_EC2 }}
      TG_NON_INTERACTIVE: "true"
      TF_CLI_ARGS_plan: "-no-color"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Each environment is a different AWS account, and the branch decides which one:
      # develop -> dev, main -> prod. A manual run from any other branch
      # must never assume another environment's role.
      - name: Validate branch for the environment
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          case "$TARGET:$GITHUB_REF" in
            dev:refs/heads/develop | prod:refs/heads/main) ;;
            *)
              echo "::error::Branch $GITHUB_REF cannot deploy the '$TARGET' environment"
              exit 1
              ;;
          esac

      - name: Validate environment configuration
        working-directory: environments/${{ inputs.environment }}
        env:
          TARGET: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN_SET: ${{ secrets.ROLE_ARN != '' }}
          AWS_ACCOUNT_ID_SET: ${{ secrets.AWS_ACCOUNT_ID != '' }}
          SUPPORT_EMAIL_SET: ${{ secrets.SUPPORT_EMAIL != '' }}
        run: |
          missing=0
          for name in AWS_REGION ROUTE53_ZONE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable '$name' is not set in the '$TARGET' GitHub environment"
              missing=1
            fi
          done
          for secret in ROLE_ARN AWS_ACCOUNT_ID SUPPORT_EMAIL; do
            flag="${secret}_SET"
            if [ "${!flag}" != "true" ]; then
              echo "::error::Secret '$secret' is not set in the '$TARGET' GitHub environment"
              missing=1
            fi
          done
          # At least one backend weight must be set (the module refuses all-zero weights).
          if [ -z "$API_WEIGHT_SLS$API_WEIGHT_ECS$API_WEIGHT_EKS$API_WEIGHT_EC2" ]; then
            echo "::error::Set at least one of the variables API_WEIGHT_SLS, API_WEIGHT_ECS, API_WEIGHT_EKS or API_WEIGHT_EC2 in the '$TARGET' GitHub environment"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          # The provider region comes from env.hcl: the credentials must target the same one.
          if ! grep -qE "^\s*aws_region\s*=\s*\"$AWS_REGION\"" env.hcl; then
            echo "::error file=environments/$TARGET/env.hcl::AWS_REGION ($AWS_REGION) does not match aws_region in env.hcl"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          role-session-name: gha-shared-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify target AWS account
        env:
          EXPECTED_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Credentials point to account $ACTUAL_ACCOUNT, expected $EXPECTED_ACCOUNT"
            exit 1
          fi

      - name: Setup IaC Tooling
        uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      # The plan is saved and the SAME file is applied: what the guard checks is what runs, also when
      # the prod approval makes the job wait. One unit today; loop over the units if more are added.
      - name: Terragrunt Plan
        working-directory: environments/${{ inputs.environment }}/api-hostname
        run: terragrunt plan -out=tfplan

      # Owner rule (2026-10-06): this repository owns the certificate and the DNS of the API. A plan
      # that deletes or replaces anything (a replacement is delete + create) is refused; run it by hand
      # and review it if it is intended.
      - name: Refuse destroys and replacements
        working-directory: environments/${{ inputs.environment }}/api-hostname
        run: |
          terragrunt show -json tfplan > "$RUNNER_TEMP/plan.json"
          jq -e . "$RUNNER_TEMP/plan.json" > /dev/null || { echo "::error::Could not read the saved plan as JSON"; exit 1; }
          DELETES=$(jq -r '[.resource_changes[]? | select(.change.actions | index("delete")) | .address] | join(", ")' "$RUNNER_TEMP/plan.json")
          if [ -n "$DELETES" ]; then
            echo "::error::The plan deletes or replaces: $DELETES"
            exit 1
          fi
          echo "No delete and no replacement in the saved plan"

      - name: Terragrunt Apply
        working-directory: environments/${{ inputs.environment }}/api-hostname
        run: terragrunt apply tfplan

      - name: Summary of the API edge
        working-directory: environments/${{ inputs.environment }}/api-hostname
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          {
            echo "### API edge ($TARGET)"
            echo "Host name: $(terragrunt output -raw api_domain_name)"
            echo "Weights of the published backends:"
            terragrunt output -json active_backends | jq -r 'to_entries[] | "- \(.key): \(.value)"'
          } >> "$GITHUB_STEP_SUMMARY"
